<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glossario · FossDot · Gruppo 15</title>
<link rel="icon" href="assets/img/favicon.png">
<style>:root{--sfondo:#f5f7fe;--superficie:#fff;--testo:#0c1230;--testo-2:#4a5275;--linea:#e1e6f5;--accento:#2551d6;--bottone:#2551d6;--bottone-testo:#fff;--chip:#e8eeff;--prep-sfondo:#eef0fa;--prep-testo:#4a5275;--titoli:system-ui,sans-serif;--mono:ui-monospace,Consolas,monospace}</style>
<link rel="stylesheet" href="assets/css/style.css">
<style>
[hidden]{display:none!important}
.pagina{display:flex;flex-direction:column;gap:24px}
.toolbar{position:sticky;top:var(--alt-testata,76px);z-index:5;background:var(--sfondo);padding:12px 0;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--linea)}
.search-row{display:flex;flex-wrap:wrap;gap:12px}
.search-box{flex:1 1 260px}
.search-box input{width:100%;padding:11px 16px;border:1px solid var(--linea);border-radius:12px;background:var(--superficie);color:var(--testo);font:inherit}
.search-box input:focus-visible{outline:3px solid var(--accento);outline-offset:2px}
.filters,.letters{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:9px 16px;border-radius:999px;border:1px solid var(--linea);background:var(--superficie);color:var(--testo-2);font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
.chip:hover:not(.active):not(:disabled){background:var(--chip);color:var(--testo)}
.chip.active{background:var(--bottone);border-color:var(--bottone);color:var(--bottone-testo)}
.chip:disabled{opacity:.35;cursor:default}
.letters .chip{padding:5px 10px;font-family:var(--mono);font-size:13px}
.group{margin-bottom:40px}
.letter{margin:0 0 16px;font-family:var(--titoli);font-size:30px;line-height:1;color:var(--accento);scroll-margin-top:calc(var(--alt-testata,76px) + 190px)}
.entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--superficie);border:1px solid var(--linea);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:calc(var(--alt-testata,76px) + 190px);transition:box-shadow .3s,border-color .3s}
.card.highlight{border-color:var(--accento);box-shadow:0 0 0 3px var(--chip)}
.card-header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.card h3{margin:0;font-family:var(--titoli);font-size:21px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--testo)}
.card p{margin:0}
.card .def{color:var(--testo)}
.gloss-link{color:var(--accento);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;font-weight:500}
.gloss-link:hover{text-decoration-style:solid}
@media (max-width:760px){
  .entries{grid-template-columns:1fr}
  .letters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .letters::-webkit-scrollbar{display:none}
  .letter,.card{scroll-margin-top:calc(var(--alt-testata,76px) + 210px)}
}
</style>
</head>
<body>
<header class="header"><div class="contenitore testata-riga">
  <a class="brand" href="index.html"><img src="assets/img/favicon.png" alt="">BENDING FORKS</a>
  <nav class="nav-links"><a href="index.html">← Torna al sito</a></nav>
  <div class="actions">
    <a href="Glossario.pdf">Scarica PDF</a>
    <button id="themeBtn" type="button" aria-label="Cambia tema">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</div></header>

<main class="contenitore"><div class="pagina">
  <div>
    <h2>Glossario</h2>
    <span id="totalCount"></span>
  </div>
  <div class="toolbar">
    <div class="search-row">
      <div class="search-box"><input type="search" id="searchInput" placeholder="Cerca un termine..." autocomplete="off" aria-label="Cerca un termine"></div>
      <div class="filters" id="filters">
        <button class="chip active" data-f="all">Tutti</button>
        <button class="chip" data-f="term">Termini</button>
        <button class="chip" data-f="abbr">Acronimi</button>
      </div>
    </div>
    <div class="letters" id="letterNav"></div>
  </div>
  <div id="lista"></div>
  <div class="empty" id="noResults" hidden>Nessun termine trovato</div>
</div></main>

<footer class="footer"><div class="contenitore piede-riga">
  <div>
    <strong>FossDot · Gruppo 15</strong><br>
    <span>Ingegneria del Software 2026/27 · Università di Padova</span><br>
    <span>Versione 0.2.0</span>
  </div>
  <div>
    <a href="index.html">Sito del progetto</a> ·
    <a href="Glossario.pdf">PDF</a>
  </div>
</div></footer>

<script>
const DATA = [{"term": "Agent", "type": "term", "definition": "Sistema progettato per eseguire in modo autonomo un'attività, coordinando flussi di lavoro (workflow) tramite istruzioni predefinite e strumenti esterni."}, {"term": "Analisi dei requisiti", "type": "term", "definition": "Attività che individua e formalizza i bisogni dell'utente traducendoli in requisiti e funzionalità che il prodotto software deve soddisfare."}, {"term": "API", "type": "abbr", "expansion": "Application Programming Interface", "definition": "Insieme di specifiche e protocolli che consentono a due componenti software di comunicare e scambiare dati."}, {"term": "Back-end", "type": "term", "definition": "La parte del sistema eseguita su server incaricata dell'elaborazione logica, dell'accesso ai dati e del coordinamento dei servizi."}, {"term": "Beamforming", "type": "term", "definition": "Tecnica di elaborazione del segnale acustico applicata all'array di microfoni per filtrare il rumore d'ambiente e focalizzare l'ascolto verso la sorgente della voce."}, {"term": "BOM", "type": "abbr", "expansion": "Bill of Materials", "definition": "Distinta base che elenca in modo analitico tutte le parti fisiche, elettroniche e meccaniche necessarie alla realizzazione del dispositivo smart speaker."}, {"term": "Embedded", "type": "term", "definition": "Sistema elettronico programmabile a microprocessore o microcontrollore progettato per svolgere compiti dedicati a risorse limitate."}, {"term": "Esecuzione in locale", "type": "term", "definition": "Elaborazione di modelli e dati eseguita interamente sull'hardware locale senza trasmettere informazioni a server remoti."}, {"term": "HAL", "type": "abbr", "expansion": "Hardware Abstraction Layer", "definition": "Strato software che espone interfacce uniformi alle applicazioni mascherando i dettagli fisici dell'hardware sottostante."}, {"term": "Inspection", "type": "term", "definition": "Nell'analisi statica, si intende come una lettura mirata del codice, guidata da una checklist dei tipici errori, per scoprire i difetti del codice."}, {"term": "Linter", "type": "term", "definition": "Software che analizza il codice sorgente in ricerca di errori di programmazione, errori stilistici, bug e costrutti sospetti."}, {"term": "LLM", "type": "abbr", "expansion": "Large Language Model", "definition": "Modello neurale di intelligenza artificiale addestrato per comprendere, elaborare e generare testo in linguaggio naturale."}, {"term": "MCP", "type": "abbr", "expansion": "Model Context Protocol", "definition": "Standard open-source impiegato per connettere applicazioni LLM a fonti dati o strumenti esterni (ad es. database o motori di ricerca)."}, {"term": "MCU", "type": "abbr", "expansion": "Microcontroller Unit", "definition": "Circuito integrato a basso consumo contenente CPU, memoria e periferiche di I/O, impiegato per l'esecuzione diretta del firmware di controllo."}, {"term": "Mic Array", "type": "term", "definition": "Insieme geometrico di due o più microfoni coordinati per la rilevazione direzionale del suono a distanza e la soppressione dell'eco acustico."}, {"term": "MVP", "type": "abbr", "expansion": "Minimum Viable Product", "definition": "Versione preliminare del prodotto dotata di funzionalità minime ma sufficienti per validare un'idea di prodotto nelle prime fasi di sviluppo e guidare le iterazioni successive."}, {"term": "Open source", "type": "term", "definition": "Modello di distribuzione del software con codice sorgente pubblico liberamente ispezionabile, modificabile e riutilizzabile secondo i termini di una specifica licenza."}, {"term": "OTA", "type": "abbr", "expansion": "Over-The-Air", "definition": "Modalità di aggiornamento del firmware embedded tramite interfaccia di rete senza richiedere connessioni fisiche di programmazione."}, {"term": "PB", "type": "abbr", "expansion": "Product Baseline", "definition": "Fase del progetto didattico, in cui si valuta la maturità della baseline architetturale del prodotto software e la sua realizzazione, includendo il design definitivo contenuto nel documento Specifica Tecnica. Sarà presente anche un avanzamento sostanziale del prodotto, che sarà valutato dal proponente come MVP, basandosi sulla sua qualità e adeguatezza."}, {"term": "PDCA", "type": "abbr", "expansion": "Plan Do Check Act", "definition": "Noto anche come ciclo di Deming, è un metodo di gestione iterativo in quattro fasi utilizzato in ambito aziendale per il controllo e il miglioramento continuo dei processi e dei prodotti."}, {"term": "Pipeline", "type": "term", "definition": "Catena di elaborazione sequenziale in cui l'output di uno stadio costituisce direttamente l'input di quello successivo."}, {"term": "POC", "type": "abbr", "expansion": "Proof of Concept", "definition": "Realizzazione di un prodotto per determinare la fattibilità o confermare la validità di alcuni principi o concetti fondamentali. Deve essere coerente con gli obiettivi del capitolato."}, {"term": "RTB", "type": "abbr", "expansion": "Requirements and Technology Baseline", "definition": "Fase del progetto didattico, in cui vengono fissati i requisiti da soddisfare, concordati con la proponente, e motivate le tecnologie, framework e librerie selezionate per la realizzazione del prodotto. Il tutto verrà dimostrato da un Proof of Concept."}, {"term": "SBC", "type": "abbr", "expansion": "Single-Board Computer", "definition": "Elaboratore completo integrato su un'unica scheda (es. Raspberry Pi), in grado di far girare un sistema operativo general-purpose completo."}, {"term": "Self-hosted", "type": "term", "definition": "Modalità di installazione ed esercizio di un servizio su server o hardware controllato direttamente dall'utente o dall'organizzazione."}, {"term": "Servizi cloud", "type": "term", "definition": "Infrastrutture, piattaforme o software erogati e gestiti da provider terzi su rete remota via Internet."}, {"term": "Servizio di bridging", "type": "term", "definition": "Servizio di interconnessione che fa da tramite dallo smart speaker al provider AI configurato e ai servizi di integrazione, orchestrando la sequenza STT → LLM → TTS."}, {"term": "Skill", "type": "term", "definition": "Pacchetto modulare di istruzioni portabili e riutilizzabili che definiscono come un agent esegue compiti specifici."}, {"term": "Smart speaker", "type": "term", "definition": "Dispositivo hardware dotato di microfoni, altoparlante e connettività di rete per l'interazione vocale automatizzata con l'utente."}, {"term": "STT", "type": "abbr", "expansion": "Speech-To-Text", "definition": "Tecnologia che converte automaticamente il linguaggio parlato in testo scritto."}, {"term": "Tailoring", "type": "term", "definition": "L'atto di modificare o sistemare un qualcosa per adattarlo ad uno scopo particolare."}, {"term": "TTS", "type": "abbr", "expansion": "Text-To-Speech", "definition": "Tecnologia che converte il testo scritto in voce sintetizzata."}, {"term": "VAD", "type": "abbr", "expansion": "Voice Activity Detection", "definition": "Insieme di algoritmi atti a rilevare la presenza o l'assenza di voce umana nel flusso audio, evitando l'invio e l'elaborazione di pacchetti durante le pause di silenzio."}, {"term": "Wake word", "type": "term", "definition": "Parola o locuzione chiave (ad es. «Hey Siri» o «Alexa») costantemente monitorata dal dispositivo per attivare l'elaborazione dei comandi vocali successivi."}, {"term": "Walkthrough", "type": "term", "definition": "Nell'analisi statica, si intende come una lettura completa e a largo spettro, dove si scelgono alcuni casi di test e si simula l'esecuzione del codice a mano (si attraversa \"walkthrough\" il codice)."}, {"term": "Way of working", "type": "term", "definition": "Rappresenta l'insieme di pratiche, regole e convenzioni adottate dal gruppo per completare gli obiettivi del progetto in modo professionale."}];
const $ = id => document.getElementById(id);
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const slugify = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'term';
let filter = 'all';

const ALIAS_MAP = new Map();
DATA.forEach(e => {
  const slug = slugify(e.term);
  ALIAS_MAP.set(e.term.toLowerCase(), { slug, owner: e.term });
  if (e.expansion) {
    const exp = e.expansion.trim().toLowerCase();
    if (exp && !ALIAS_MAP.has(exp)) ALIAS_MAP.set(exp, { slug, owner: e.term });
  }
});
const SORTED_ALIASES = Array.from(ALIAS_MAP.keys()).sort((a, b) => b.length - a.length);
const ESC_RE = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const LINK_RE = SORTED_ALIASES.length
  ? new RegExp('(^|[^A-Za-zÀ-ÖØ-öø-ÿ0-9_-])(' + SORTED_ALIASES.map(ESC_RE).join('|') + ')(?=$|[^A-Za-zÀ-ÖØ-öø-ÿ0-9_-])', 'gi')
  : null;

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function jumpToTerm(slug) {
  let target = $('term-' + slug);
  if (!target) {
    filter = 'all';
    $('searchInput').value = '';
    document.querySelectorAll('#filters .chip').forEach(x => x.classList.toggle('active', x.dataset.f === 'all'));
    render();
    target = $('term-' + slug);
  }
  if (target) {
    const header = document.querySelector('.header');
    const toolbar = document.querySelector('.toolbar');
    const offset = (header ? header.offsetHeight : 0) + (toolbar ? toolbar.offsetHeight : 0) + 32;
    const top = target.getBoundingClientRect().top + window.scrollY - offset;
    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });

    target.classList.remove('highlight');
    void target.offsetWidth;
    target.classList.add('highlight');
    setTimeout(() => target.classList.remove('highlight'), 2000);
  }
}

function buildLinkedDef(text, currentTerm) {
  const p = el('p', null, 'def');
  if (!LINK_RE) { p.textContent = text; return p; }
  LINK_RE.lastIndex = 0;
  let last = 0, m;
  while ((m = LINK_RE.exec(text)) !== null) {
    const prefix = m[1];
    const matched = m[2];
    const info = ALIAS_MAP.get(matched.toLowerCase());
    if (!info || info.owner === currentTerm) continue;
    const start = m.index + prefix.length;
    if (start > last) p.appendChild(document.createTextNode(text.slice(last, start)));
    const a = el('a', matched, 'gloss-link');
    a.href = '#term-' + info.slug;
    a.onclick = ev => { ev.preventDefault(); jumpToTerm(info.slug); };
    p.appendChild(a);
    last = start + matched.length;
  }
  if (last < text.length) p.appendChild(document.createTextNode(text.slice(last)));
  return p;
}

function render() {
  const q = norm($('searchInput').value.trim());
  const shown = DATA.filter(e =>
    (filter === 'all' || e.type === filter) &&
    (!q || norm(e.term + ' ' + (e.expansion || '') + ' ' + e.definition).includes(q)));
  const lista = $('lista');
  lista.replaceChildren();
  const present = new Set();
  let grid = null;
  let current = '';
  shown.forEach(e => {
    const L = norm(e.term)[0].toUpperCase();
    present.add(L);
    if (L !== current) {
      current = L;
      const g = el('div', null, 'group');
      const h = el('h2', L, 'letter'); h.id = 'letter-' + L;
      grid = el('div', null, 'entries');
      g.append(h, grid);
      lista.appendChild(g);
    }
    const a = el('article', null, 'card');
    a.id = 'term-' + slugify(e.term);
    const header = el('div', null, 'card-header');
    header.appendChild(el('h3', e.term));
    if (e.type === 'abbr') header.appendChild(el('span', 'Acronimo', 'badge prep'));
    a.appendChild(header);
    if (e.expansion) a.appendChild(el('p', e.expansion, 'meta'));
    a.appendChild(buildLinkedDef(e.definition, e.term));
    grid.appendChild(a);
  });
  $('noResults').hidden = shown.length > 0;
  $('totalCount').textContent = shown.length + (shown.length === 1 ? ' termine' : ' termini');
  const nav = $('letterNav');
  nav.replaceChildren();
  for (let c = 65; c <= 90; c++) {
    const L = String.fromCharCode(c);
    const b = el('button', L, 'chip');
    b.disabled = !present.has(L);
    b.onclick = () => {
      const target = $('letter-' + L);
      if (target) target.scrollIntoView();
    };
    nav.appendChild(b);
  }
}

$('searchInput').addEventListener('input', render);
document.querySelectorAll('#filters .chip').forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('#filters .chip').forEach(x => x.classList.toggle('active', x === b));
  render();
});

const root = document.documentElement;
try { const s = localStorage.getItem('tema'); if (s) root.dataset.theme = s; } catch (e) {}
$('themeBtn').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark'
                                  : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = dark ? 'light' : 'dark';
  root.dataset.theme = next;
  try { localStorage.setItem('tema', next); } catch (e) {}
};
render();
</script>
</body>
</html>
